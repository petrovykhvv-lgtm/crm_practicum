services:
  db:
    image: postgres:16-alpine
    container_name: crm-practicum-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_local_password
      POSTGRES_DB: crm_practicum
    ports:
      - "5433:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_practicum"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  crm_pgdata:
