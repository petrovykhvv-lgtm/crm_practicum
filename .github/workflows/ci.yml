name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_local_password
          POSTGRES_DB: crm_practicum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_practicum"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Тесты сами создают базу crm_practicum_test и применяют к ней миграции; рабочая база не затрагивается.
      DATABASE_URL: postgresql://crm:crm_local_password@localhost:5432/crm_practicum?schema=public
      APP_TIMEZONE: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
